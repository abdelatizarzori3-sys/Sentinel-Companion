<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070e" />
    <title>Sentinel — معرض الروبوت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme:dark; --ink:#eff8ff; --muted:#9eafc5; --cyan:#52e8ff; --blue:#4785ff; --green:#50f4b1; --red:#ff5b7f; --metal:#1b2638; --ease:cubic-bezier(.23,1,.32,1); }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(ellipse at 50% 60%,#15294b 0,rgba(7,16,33,.76) 35%,transparent 65%),linear-gradient(150deg,#05070e 0%,#0b101d 46%,#05070e 100%); font-family:Cairo,sans-serif; }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.72; background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 9.5vw),linear-gradient(180deg,rgba(210,236,255,.09),transparent 18%,transparent 74%,rgba(10,21,37,.85)); }
      .museum { position:relative; display:grid; grid-template-rows:auto minmax(17rem,1fr) auto auto; min-height:100svh; isolation:isolate; }
      .museum-head { position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:max(1.1rem,env(safe-area-inset-top)) 1.2rem 0; }
      .exhibit-id { display:flex; align-items:center; gap:.62rem; min-width:0; } .exhibit-light { width:.6rem; height:.6rem; border-radius:50%; background:var(--cyan); box-shadow:0 0 1rem var(--cyan); animation:signal 2s ease-in-out infinite; } .exhibit-id p { margin:0; color:#d5e3f6; font:600 .6rem/1.4 Orbitron,Cairo,sans-serif; letter-spacing:.18em; } .exhibit-id span { display:block; color:var(--muted); font:500 .59rem/1.4 Cairo,sans-serif; letter-spacing:0; }
      .gallery-status { max-width:52%; color:#bdefff; font-size:.68rem; font-weight:700; text-align:left; text-shadow:0 0 .9rem rgba(82,232,255,.45); }
      .exhibit-room { position:relative; display:grid; place-items:center; min-height:0; perspective:1150px; overflow:hidden; }
      .ceiling { position:absolute; inset:0 0 auto; height:32%; background:linear-gradient(180deg,rgba(70,102,145,.17),transparent); clip-path:polygon(0 0,100% 0,82% 100%,18% 100%); } .ceiling::after { content:""; position:absolute; top:13%; left:50%; width:32%; height:4px; transform:translateX(-50%); background:#dffaff; box-shadow:0 0 .65rem .15rem #7bf3ff,0 0 4.5rem 1rem rgba(89,183,255,.45); }
      .light-beam { position:absolute; top:4%; left:50%; width:min(76vw,32rem); height:75%; transform:translateX(-50%); background:linear-gradient(90deg,rgba(101,194,255,.01),rgba(103,211,255,.17),rgba(150,105,255,.08),rgba(103,211,255,.17),rgba(101,194,255,.01)); clip-path:polygon(43% 0,57% 0,100% 100%,0 100%); mix-blend-mode:screen; animation:gallery-breathe 6s ease-in-out infinite; }
      .wall-line { position:absolute; top:50%; right:0; left:0; height:1px; background:linear-gradient(90deg,transparent,rgba(103,229,255,.2),transparent); box-shadow:0 0 1.2rem rgba(82,232,255,.26); }
      .museum-floor { position:absolute; right:-13%; bottom:-9%; left:-13%; height:38%; transform:perspective(800px) rotateX(69deg); transform-origin:bottom; background:linear-gradient(rgba(98,216,255,.19) 1px,transparent 1px),linear-gradient(90deg,rgba(98,216,255,.16) 1px,transparent 1px),radial-gradient(ellipse at center,rgba(55,128,211,.33),transparent 72%); background-size:28px 28px,28px 28px,100% 100%; mask-image:linear-gradient(to top,black,transparent); }
      .display-ring { position:absolute; bottom:19%; left:50%; width:min(91vw,31rem); aspect-ratio:2.8/1; transform:translateX(-50%) rotateX(71deg); border:1px solid rgba(105,234,255,.58); border-radius:50%; box-shadow:0 0 1rem rgba(75,224,255,.45),inset 0 0 1rem rgba(75,224,255,.28); animation:ring 4s ease-in-out infinite; }
      .plinth { position:absolute; z-index:2; bottom:12%; left:50%; width:min(65vw,18rem); height:3.8rem; transform:translateX(-50%) perspective(250px) rotateX(17deg); border:1px solid rgba(145,229,255,.42); border-radius:50% 50% 18% 18%; background:linear-gradient(180deg,rgba(138,224,255,.34),rgba(17,35,62,.92) 42%,#07111f); box-shadow:0 1.3rem 2.5rem rgba(0,0,0,.45),0 0 2rem rgba(71,205,255,.24),inset 0 .5rem .8rem rgba(220,251,255,.28); } .plinth::after { content:"SENTINEL · AI EXHIBIT"; position:absolute; right:0; bottom:.55rem; left:0; color:#baf6ff; font:600 .55rem Orbitron,Cairo,sans-serif; letter-spacing:.12em; text-align:center; text-shadow:0 0 .5rem var(--cyan); }
      .robot-frame { position:relative; z-index:3; align-self:end; width:min(82vw,23rem); aspect-ratio:3/4; margin-bottom:7%; transform:translateZ(50px); filter:drop-shadow(0 1.6rem 1.8rem rgba(0,0,0,.62)); animation:idle-breathe 4.5s var(--ease) infinite; } .robot-frame::before { content:""; position:absolute; z-index:-1; inset:12% 4% 5%; border-radius:46%; background:radial-gradient(ellipse,rgba(69,235,255,.41),rgba(62,115,255,.1) 49%,transparent 71%); filter:blur(25px); }
      .robot-frame img { display:block; width:100%; height:100%; object-fit:contain; object-position:center; mix-blend-mode:screen; } .robot-frame::after { content:""; position:absolute; z-index:4; top:27%; left:26%; width:47%; height:14%; border-radius:47%; pointer-events:none; background:radial-gradient(ellipse at center,rgba(126,249,255,.13),transparent 62%); opacity:.55; mix-blend-mode:screen; animation:eye-pulse 3.4s ease-in-out infinite; }
      .lip-sync { position:absolute; z-index:5; top:42.75%; left:50%; width:13.5%; height:2.35%; transform:translateX(-50%) scaleY(.52); border:1px solid rgba(148,244,255,.85); border-radius:999px; background:radial-gradient(ellipse,rgba(3,17,44,.98),rgba(5,10,28,.68)); box-shadow:0 0 .72rem rgba(82,235,255,.58),inset 0 0 .35rem rgba(82,235,255,.44); opacity:.74; transition:opacity 130ms var(--ease); } .lip-sync::after { content:""; position:absolute; inset:34% 13%; border-radius:inherit; background:linear-gradient(90deg,transparent,#b8fbff,transparent); }
      .curator-label { position:absolute; z-index:4; top:18%; left:clamp(.7rem,4vw,2rem); display:grid; gap:.25rem; padding:.52rem .64rem; border-right:2px solid rgba(96,232,255,.7); background:linear-gradient(90deg,rgba(6,18,34,.74),transparent); color:#c2f3ff; font:600 .54rem/1.55 Orbitron,Cairo,sans-serif; letter-spacing:.1em; opacity:.78; } .curator-label span { color:#7997bb; font:500 .57rem Cairo,sans-serif; letter-spacing:0; }
      .robot-stage { position:absolute; inset:0; } .robot-stage[data-state="listening"] .robot-frame { animation:listen-pose 1.15s ease-in-out infinite; } .robot-stage[data-state="listening"] .display-ring { border-color:#75ffca; box-shadow:0 0 1.4rem rgba(80,244,177,.75),inset 0 0 1rem rgba(80,244,177,.32); } .robot-stage[data-state="thinking"] .robot-frame { animation:think-pose 1.7s ease-in-out infinite; filter:drop-shadow(0 0 1.55rem rgba(164,115,255,.74)); } .robot-stage[data-state="thinking"] .light-beam { opacity:.78; animation:thinking-light .86s ease-in-out infinite; } .robot-stage[data-state="speaking"] .robot-frame { animation:speak-pose .72s ease-in-out infinite; } .robot-stage[data-state="speaking"] .lip-sync { opacity:1; animation:lip-talk .19s steps(2,end) infinite; box-shadow:0 0 1.05rem rgba(101,238,255,1),inset 0 0 .48rem rgba(101,238,255,.8); } .robot-stage[data-state="speaking"] .display-ring { border-color:#d5faff; animation-duration:.9s; } .robot-stage[data-state="speaking"] .curator-label { color:#e1fdff; border-color:#d5faff; } .robot-stage[data-state="error"] .gallery-status { color:#ffbdcf; }
      .chat-dock { position:relative; z-index:7; width:min(43rem,calc(100% - 2rem)); min-height:9.35rem; max-height:12.2rem; margin:0 auto; overflow:hidden; border:1px solid rgba(122,229,255,.3); border-radius:1.1rem; background:linear-gradient(125deg,rgba(12,25,45,.95),rgba(6,12,24,.97)); box-shadow:0 1rem 2.1rem rgba(0,0,0,.3),inset 0 1px rgba(240,252,255,.08); backdrop-filter:blur(16px); } .chat-head { display:flex; align-items:center; justify-content:space-between; gap:.7rem; padding:.58rem .75rem; border-bottom:1px solid rgba(130,219,255,.16); color:#c7f5ff; font:600 .62rem Orbitron,Cairo,sans-serif; letter-spacing:.08em; } .chat-live { display:flex; align-items:center; gap:.35rem; color:#91ffce; font:600 .57rem Cairo,sans-serif; letter-spacing:0; }.chat-live i{width:.42rem;height:.42rem;border-radius:50%;background:#66ffbd;box-shadow:0 0 .6rem #66ffbd}.chat-log { display:grid; align-content:start; gap:.42rem; min-height:3.55rem; max-height:5.25rem; overflow-y:auto; padding:.6rem .72rem; scrollbar-width:thin; scrollbar-color:rgba(88,229,255,.5) transparent; }.chat-message{max-width:86%;padding:.36rem .58rem;border:1px solid rgba(147,219,255,.13);border-radius:.65rem;color:#eaf6ff;background:rgba(58,101,144,.18);font-size:.68rem;line-height:1.65;word-break:break-word;}.chat-message--user{justify-self:start;border-color:rgba(82,244,177,.27);background:rgba(31,144,105,.16);color:#d6ffeb}.chat-message--assistant{justify-self:end;border-color:rgba(101,214,255,.26);background:rgba(60,113,183,.2)}.chat-message--system{justify-self:center;color:#9db0c9;background:transparent;border-color:transparent;text-align:center;font-size:.62rem}.chat-form{display:grid;grid-template-columns:auto 1fr auto;gap:.42rem;align-items:center;padding:.52rem .62rem;border-top:1px solid rgba(130,219,255,.15);}.chat-form input{min-width:0;height:2.28rem;border:1px solid rgba(126,216,255,.24);border-radius:.65rem;padding:0 .64rem;color:#effaff;background:rgba(2,7,17,.65);font:600 .68rem Cairo,sans-serif;outline:none;transition:border-color 160ms var(--ease),box-shadow 160ms var(--ease);}.chat-form input:focus{border-color:rgba(91,238,255,.8);box-shadow:0 0 .8rem rgba(79,223,255,.17)}.chat-form input:disabled{opacity:.5}.chat-send,.chat-abort{display:grid;place-items:center;width:2.28rem;height:2.28rem;border:0;border-radius:.65rem;cursor:pointer;font:800 1rem/1 Cairo,sans-serif;transition:transform 150ms var(--ease),opacity 150ms var(--ease);}.chat-send{color:#04272f;background:linear-gradient(135deg,#6ef6ff,#5ab1ff);box-shadow:0 .35rem .8rem rgba(83,231,255,.24)}.chat-abort{color:#ffd7e2;background:rgba(255,91,127,.14);border:1px solid rgba(255,112,147,.25)}.chat-send:active,.chat-abort:active{transform:scale(.93)}.chat-send:disabled,.chat-abort:disabled{opacity:.32;cursor:not-allowed}
      .side-console { position:relative; z-index:6; display:grid; grid-template-columns:1fr 1.35fr 1fr; align-items:end; gap:.7rem; padding:.6rem 1rem max(1.35rem,calc(.7rem + env(safe-area-inset-bottom))); background:linear-gradient(180deg,transparent,rgba(2,5,11,.82) 28%); } .control-key { display:grid; justify-items:center; gap:.32rem; min-height:4.8rem; border:1px solid rgba(152,217,255,.28); border-radius:1rem; color:#e5f6ff; background:linear-gradient(145deg,rgba(31,55,84,.85),rgba(7,14,27,.94)); box-shadow:inset 0 1px rgba(255,255,255,.08),0 .65rem 1.3rem rgba(0,0,0,.3); font:700 .64rem Cairo,sans-serif; cursor:pointer; transition:transform 160ms var(--ease),border-color 160ms var(--ease),opacity 160ms var(--ease); } .control-key:active { transform:scale(.96); } .control-key:focus-visible { outline:2px solid white; outline-offset:3px; } .control-key[disabled] { opacity:.34; cursor:not-allowed; } .control-key i { display:grid; place-items:center; width:1.62rem; height:1.62rem; border-radius:50%; font-style:normal; font:700 1rem/1 Orbitron,sans-serif; } .control-key--talk i { color:#032719; background:var(--green); box-shadow:0 0 .95rem var(--green); } .control-key--stop i { color:#300512; background:var(--red); box-shadow:0 0 .95rem var(--red); } .control-key--talk[data-active="true"] { border-color:rgba(80,244,177,.85); box-shadow:0 0 1.6rem rgba(80,244,177,.22),inset 0 1px rgba(255,255,255,.08); } .control-key--talk[data-active="true"] i { animation:signal .82s ease-in-out infinite; }
      .exhibit-plaque { align-self:center; padding:.42rem .45rem; border-top:1px solid rgba(113,225,255,.32); border-bottom:1px solid rgba(113,225,255,.18); color:#c0efff; background:rgba(9,21,38,.56); font:600 .58rem/1.6 Orbitron,Cairo,sans-serif; letter-spacing:.09em; text-align:center; } .exhibit-plaque small { display:block; color:#7894b7; font:500 .55rem Cairo,sans-serif; letter-spacing:0; }
      @keyframes idle-breathe { 50% { transform:translate3d(0,-.55rem,54px) rotateY(-1.4deg); } } @keyframes listen-pose { 50% { transform:translate3d(0,-.25rem,55px) rotateY(-3deg) scale(1.024); } } @keyframes think-pose { 0%,100% { transform:translateZ(50px) rotateY(0); } 50% { transform:translate3d(-.25rem,-.35rem,56px) rotateY(5deg); } } @keyframes speak-pose { 50% { transform:translate3d(0,-.35rem,53px) scale(1.012); } } @keyframes lip-talk { from { transform:translateX(-50%) scaleX(.93) scaleY(.5); } to { transform:translateX(-50%) scaleX(1.08) scaleY(2.55); } } @keyframes eye-pulse { 50% { opacity:.95; } } @keyframes ring { 50% { transform:translateX(-50%) rotateX(71deg) scale(1.04); opacity:.75; } } @keyframes signal { 50% { transform:scale(1.18); box-shadow:0 0 1.55rem currentColor; } } @keyframes thinking-light { 50% { filter:hue-rotate(38deg) brightness(1.4); } } @keyframes gallery-breathe { 50% { opacity:.58; filter:brightness(1.26); } }
      @media (min-width:45rem) { .museum{grid-template-columns:minmax(0,1fr) minmax(20rem,32rem);grid-template-rows:auto minmax(31rem,1fr) auto}.museum-head{grid-column:1/-1;padding-inline:2.2rem}.exhibit-room{grid-row:2/4}.chat-dock{grid-column:2;grid-row:2;align-self:center;width:calc(100% - 1.3rem);max-height:20rem;margin:0 .65rem;}.chat-log{max-height:12rem}.side-console{grid-column:2;grid-row:3;width:100%;margin:0;padding-bottom:1.5rem}.control-key{min-height:5.3rem}.display-ring{bottom:17%;}.plinth{bottom:11%;} }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <main class="museum" aria-label="معرض Sentinel التفاعلي">
      <header class="museum-head"><div class="exhibit-id"><i class="exhibit-light" aria-hidden="true"></i><p>EXHIBIT 01<span>Sentinel · رفيق تفاعلي</span></p></div><div id="robot-state-label" class="gallery-status" role="status" aria-live="polite">اضغط «تحدّث» وقل ما تريد</div></header>
      <section class="exhibit-room" aria-label="روبوت Sentinel المعروض في المتحف">
        <div class="ceiling" aria-hidden="true"></div><div class="light-beam" aria-hidden="true"></div><div class="wall-line" aria-hidden="true"></div><div class="museum-floor" aria-hidden="true"></div><div class="display-ring" aria-hidden="true"></div><div class="plinth" aria-hidden="true"></div>
        <div id="robot-stage" class="robot-stage" data-state="idle"><aside class="curator-label" aria-label="هوية المعروض">AE-01 // SENTINEL<span>رفيق تفاعلي بالصوت والدردشة</span></aside><div class="robot-frame"><img src="https://marokecho-jrrh7cuh.manus.space/manus-storage/sentinel-neon-3d-robot_04ad6455.png" alt="روبوت Sentinel مستقبلي على منصة متحف" /><span class="lip-sync" aria-hidden="true"></span></div></div>
      </section>
      <section class="chat-dock" aria-labelledby="chat-title"><header class="chat-head"><span id="chat-title">SENTINEL // CONVERSATION</span><span class="chat-live"><i aria-hidden="true"></i><span id="knowledge-status">جاهز</span></span></header><div id="chat-log" class="chat-log" role="log" aria-live="polite"><p class="chat-message chat-message--system">كتب أو هضر مع Sentinel.</p></div><form id="chat-form" class="chat-form"><button id="chat-abort" class="chat-abort" type="button" disabled aria-label="أوقف الرد">■</button><input id="chat-input" type="text" placeholder="كتب رسالة للروبوت…" autocomplete="off" maxlength="140" aria-label="رسالتك إلى Sentinel" /><button id="chat-send" class="chat-send" type="submit" aria-label="إرسال الرسالة">↑</button></form></section>
      <nav class="side-console" aria-label="أزرار تحكم Sentinel"><button id="voice-stop" class="control-key control-key--stop" type="button" disabled aria-label="أوقف Sentinel"><i aria-hidden="true">■</i><span>إيقاف</span></button><div class="exhibit-plaque">SENTINEL CORE<small>اسمع · فكّر · جاوب · <span id="build-marker">BUILD</span></small></div><button id="voice-start" class="control-key control-key--talk" type="button" data-active="false" aria-label="تحدّث مع Sentinel"><i aria-hidden="true">●</i><span>تحدّث</span></button></nav>
    </main>
    <script src="app.js"></script>
  </body>
</html>
