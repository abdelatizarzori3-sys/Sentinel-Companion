<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040716" />
    <title>Sentinel — رفيق صوتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme:dark; --cyan:#54eaff; --green:#3cf3a6; --red:#ff547c; --ink:#eef7ff; --muted:#a8bad9; --ease:cubic-bezier(.23,1,.32,1); }
      * { box-sizing:border-box; font-family:Cairo,sans-serif; }
      body { min-height:100vh; margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(ellipse at 50% 48%,#142c67 0,rgba(12,29,75,.58) 25%,transparent 50%),radial-gradient(ellipse at 12% 2%,rgba(126,62,255,.2),transparent 38%),#040716; }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; background:linear-gradient(rgba(83,230,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(83,230,255,.045) 1px,transparent 1px); background-size:31px 31px; mask-image:radial-gradient(ellipse at center,black,transparent 76%); }
      .voice-shell { position:relative; display:grid; grid-template-rows:1fr auto; min-height:100svh; isolation:isolate; }
      .robot-stage { position:relative; display:grid; place-items:center; min-height:0; overflow:hidden; perspective:900px; transform-style:preserve-3d; }
      .ambient { position:absolute; width:min(95vw,44rem); aspect-ratio:1; border:1px solid rgba(84,234,255,.14); border-radius:50%; box-shadow:inset 0 0 5rem rgba(51,136,255,.1),0 0 5rem rgba(64,118,255,.13); }
      .holo-grid { position:absolute; bottom:-3.5rem; width:min(110vw,52rem); height:17rem; transform:rotateX(65deg); transform-origin:bottom; background:linear-gradient(rgba(85,235,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(85,235,255,.16) 1px,transparent 1px); background-size:25px 25px; mask-image:radial-gradient(ellipse,black 0,transparent 69%); }
      .orbit { position:absolute; border:1px solid rgba(93,234,255,.4); border-radius:50%; filter:drop-shadow(0 0 .5rem rgba(83,235,255,.35)); animation:spin 12s linear infinite; }
      .orbit-a { width:min(53vw,16rem); height:min(53vw,16rem); transform:rotateX(68deg) rotateZ(14deg); }
      .orbit-b { width:min(72vw,22rem); height:min(72vw,22rem); border-color:rgba(176,126,255,.31); transform:rotateX(68deg) rotateZ(-24deg); animation-duration:16s; animation-direction:reverse; }
      .robot-frame { position:relative; z-index:2; width:min(86vw,25rem); aspect-ratio:3/4; transform:translateZ(34px); filter:drop-shadow(0 1.5rem 2.25rem rgba(0,0,0,.55)); animation:float 4.6s var(--ease) infinite; }
      .robot-frame::before { content:""; position:absolute; z-index:-1; inset:13% 5% 2%; border-radius:48%; background:radial-gradient(ellipse,rgba(72,239,255,.45),rgba(77,107,255,.12) 46%,transparent 72%); filter:blur(27px); }
      .robot-frame img { display:block; width:100%; height:100%; object-fit:contain; object-position:center; mix-blend-mode:screen; }
      .lip-sync { position:absolute; z-index:3; top:42.7%; left:50%; width:13.4%; height:2.2%; transform:translateX(-50%) scaleY(.55); border:1px solid rgba(135,242,255,.72); border-radius:999px; background:radial-gradient(ellipse,rgba(6,24,62,.98),rgba(4,9,28,.7)); box-shadow:0 0 .7rem rgba(89,234,255,.45),inset 0 0 .35rem rgba(89,234,255,.42); opacity:.72; transition:opacity 130ms var(--ease); }
      .lip-sync::after { content:""; position:absolute; inset:32% 15%; border-radius:inherit; background:linear-gradient(90deg,transparent,#9df5ff,transparent); }
      .status { position:absolute; z-index:5; top:max(1.4rem,env(safe-area-inset-top)); right:1rem; left:1rem; margin:auto; width:max-content; max-width:calc(100% - 2rem); color:var(--muted); font-size:.76rem; font-weight:700; text-align:center; text-shadow:0 0 1rem rgba(82,234,255,.5); transition:color 180ms var(--ease),opacity 180ms var(--ease); }
      .robot-stage[data-state="listening"] .robot-frame { animation:listen 1.25s ease-in-out infinite; }
      .robot-stage[data-state="listening"] .orbit { animation-duration:2.4s; border-color:rgba(84,234,255,.88); }
      .robot-stage[data-state="thinking"] .robot-frame { filter:drop-shadow(0 0 1.7rem rgba(156,113,255,.72)); }
      .robot-stage[data-state="thinking"] .orbit-b { border-color:rgba(194,123,255,.95); animation-duration:2.8s; }
      .robot-stage[data-state="speaking"] .robot-frame { animation:talk .86s ease-in-out infinite; }
      .robot-stage[data-state="speaking"] .lip-sync { opacity:1; animation:lip-talk .22s steps(2,end) infinite; box-shadow:0 0 1rem rgba(90,234,255,.98),inset 0 0 .45rem rgba(90,234,255,.7); }
      .robot-stage[data-state="error"] .status { color:#ffafc3; }
      .voice-controls { position:relative; z-index:5; display:flex; justify-content:center; align-items:center; gap:2.1rem; padding:1.2rem 1.5rem max(2rem,calc(1.2rem + env(safe-area-inset-bottom))); }
      .voice-dot { position:relative; display:grid; place-items:center; width:4.75rem; height:4.75rem; border:0; border-radius:50%; cursor:pointer; transition:transform 160ms var(--ease),filter 160ms var(--ease),opacity 160ms var(--ease); }
      .voice-dot::after { content:""; position:absolute; inset:-.48rem; border:1px solid currentColor; border-radius:inherit; opacity:.34; }
      .voice-dot:focus-visible { outline:3px solid white; outline-offset:5px; } .voice-dot:active { transform:scale(.92); }
      .voice-dot--start { color:var(--green); background:radial-gradient(circle at 35% 28%,#caffeb,#45efaa 36%,#087346 74%); box-shadow:0 0 1.55rem rgba(60,243,166,.88),0 0 4rem rgba(60,243,166,.33); }
      .voice-dot--stop { color:var(--red); background:radial-gradient(circle at 35% 28%,#ffd6e1,#ff668b 36%,#8b153e 74%); box-shadow:0 0 1.4rem rgba(255,84,124,.75),0 0 4rem rgba(255,84,124,.25); }
      .voice-dot[disabled] { cursor:not-allowed; opacity:.38; filter:grayscale(.55); }
      .voice-dot svg { width:1.65rem; height:1.65rem; fill:#061920; filter:drop-shadow(0 1px rgba(255,255,255,.55)); }
      .voice-dot--stop svg { fill:#2b0611; }
      .voice-dot--start[data-active="true"] { animation:listen-pulse 1s ease-in-out infinite; }
      @keyframes float { 50% { transform:translate3d(0,-.78rem,40px) rotateY(-2deg); } }
      @keyframes listen { 50% { transform:translate3d(0,-.3rem,45px) scale(1.025); } }
      @keyframes talk { 50% { transform:translate3d(0,-.35rem,30px) scale(1.012); } }
      @keyframes lip-talk { from { transform:translateX(-50%) scaleX(.92) scaleY(.6); } to { transform:translateX(-50%) scaleX(1.08) scaleY(2.4); } }
      @keyframes spin { to { transform:rotateX(68deg) rotateZ(374deg); } }
      @keyframes listen-pulse { 50% { transform:scale(1.07); } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <main class="voice-shell" aria-label="Sentinel رفيق صوتي">
      <section class="robot-stage" id="robot-stage" data-state="idle" aria-label="روبوت Sentinel المتحرك">
        <p id="robot-state-label" class="status" role="status" aria-live="polite">اضغط النقطة الخضراء وتكلّم</p>
        <div class="ambient" aria-hidden="true"></div>
        <div class="holo-grid" aria-hidden="true"></div>
        <div class="orbit orbit-a" aria-hidden="true"></div>
        <div class="orbit orbit-b" aria-hidden="true"></div>
        <div class="robot-frame"><img src="https://marokecho-jrrh7cuh.manus.space/manus-storage/sentinel-neon-3d-robot_04ad6455.png" alt="روبوت Sentinel ثلاثي الأبعاد" /><span class="lip-sync" aria-hidden="true"></span></div>
      </section>
      <nav class="voice-controls" aria-label="التحكم الصوتي">
        <button id="voice-start" class="voice-dot voice-dot--start" type="button" data-active="false" aria-label="ابدأ الحديث مع Sentinel" title="ابدأ الحديث"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-14 0 1 1 0 1 1 2 0 5 5 0 0 0 10 0v-1ZM11 19h2v3h-2z"/></svg></button>
        <button id="voice-stop" class="voice-dot voice-dot--stop" type="button" disabled aria-label="أوقف Sentinel" title="إيقاف"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button>
      </nav>
    </main>
    <script src="app.js"></script>
  </body>
</html>
